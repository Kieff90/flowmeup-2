name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e
            cd ~/landipages/flowmeup-2
            echo "=== git pull ==="
            git pull
            echo "=== npm run build ==="
            npm run build
            echo "=== pm2 restart ==="
            pm2 restart sellingagent
            echo "=== done ==="
